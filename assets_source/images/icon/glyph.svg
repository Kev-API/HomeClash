<?xml version="1.0" encoding="UTF-8"?>
<!-- HomeClash logo glyph: three quadrilaterals on a 30-degree lattice, mitred at 60 degrees.
     Same slot geometry and length rhythm as the original FlClash glyph (139 / 69.4 / 46.32),
     but the round-capped bars are replaced by brand ribbon quads.
     Derived rasters: assets/images/icon.{png,ico}, Android mipmaps and
     ic_launcher_foreground.xml, macOS AppIcon set, Windows app_icon.ico, tray icons. -->
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>HomeClash</title>
  <defs>
    <linearGradient id="g1" x1="128.94" y1="48.43" x2="111.06" y2="100.05" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0043A0"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="g2" x1="129.56" y1="103.13" x2="111.68" y2="154.75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A6BFF"/>
      <stop offset="1" stop-color="#4F97FF"/>
    </linearGradient>
    <linearGradient id="g3" x1="130.17" y1="157.84" x2="112.29" y2="209.46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6CADFF"/>
      <stop offset="1" stop-color="#B8D9FF"/>
    </linearGradient>
  </defs>
  <polygon points="64.59,126.88 157.53,73.22 175.41,21.60 82.47,75.26" fill="url(#g1)"/>
  <polygon points="88.48,168.15 134.88,141.35 152.76,89.74 106.36,116.53" fill="url(#g2)"/>
  <polygon points="96.80,218.40 127.77,200.52 145.65,148.90 114.68,166.78" fill="url(#g3)"/>
</svg>
